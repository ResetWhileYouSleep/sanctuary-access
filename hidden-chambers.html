<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidden Chambers</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
overflow-x:hidden;
overflow-y:auto;
}

.portal{
display:block;
width:100vw;
min-height:100vh;
background:#000;
}

.portal img{
display:block;
width:100%;
height:auto;
}

.existing-member{
margin-top:18px;
text-align:center;
}

.existing-member a{
color:#d9c3a0;
text-decoration:none;
font-size:.95rem;
letter-spacing:.08em;
opacity:.85;
transition:.3s;
}

.existing-member a:hover{
opacity:1;
text-shadow:
0 0 8px rgba(255,220,170,.35);
}

</style>
</head>

<body>

<a class="portal"
href="https://www.patreon.com/BeyondTheThreshold"
target="_blank"
rel="noopener noreferrer">

<img src="assets/hidden-chambers.PNG" alt="Hidden Chambers">

</a>

<div class="existing-member">

<a href="/whispering-hall/the-chambers-await/">

✦ I Have My Sanctuary Key ✦

</a>

</div>

<audio id="sanctuary-audio" autoplay loop>
  <source src="assets/ambient.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const audio = document.getElementById('sanctuary-audio');
  if(audio){
    audio.volume = 0.45;

    const resume = () => {
      audio.play().catch(()=>{});
      document.removeEventListener('touchstart', resume);
      document.removeEventListener('click', resume);
    };

    document.addEventListener('touchstart', resume, {once:true});
    document.addEventListener('click', resume, {once:true});
  }
});
</script>

</body>
</html>
